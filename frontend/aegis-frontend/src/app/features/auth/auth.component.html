<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Sign In</mat-card-title>
      <mat-card-subtitle>Welcome back to Aegis</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="john@example.com">
          <app-aegis-form-field-error [form]="loginForm" controlName="email" [labels]="fieldLabels" />
        </mat-form-field>

        <app-aegis-password-input
          label="Password"
          placeholder="Enter your password"
          [fullWidth]="true"
          formControlName="password"
        />

        <app-aegis-loading-button
          label="Sign In"
          [loading]="isLoading"
          [disabled]="loginForm.invalid"
          [fullWidth]="true"
        />
      </form>

      <div class="auth-links">
        <a mat-button color="accent" routerLink="/register">Don't have an account? Register</a>
      </div>

      @if (enableMockLogin) {
        <div class="mock-login-section">
          <mat-divider></mat-divider>
          <p class="mock-label">Development Mode</p>
          <app-aegis-loading-button
            label="Mock Login (skip auth)"
            [loading]="isLoading"
            [fullWidth]="true"
            variant="danger"
            type="button"
            (click)="mockLogin()"
          />
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
