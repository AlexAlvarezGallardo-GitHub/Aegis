<div class="dialog-overlay" (click)="cancel()" (keydown)="onOverlayKeydown($event)" (keydown.escape)="cancel()" role="button" tabindex="0" aria-label="Close dialog">
  <div class="dialog-panel" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" role="dialog" aria-labelledby="transfer-title" cdkTrapFocus>
    <div class="dialog-header">
      <h2 id="transfer-title" class="dialog-title">{{ title }}</h2>
    </div>

    <div class="dialog-body">
      <p class="dialog-wallet">From: <span class="mono">{{ data.wallet.currency }} Wallet</span></p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Destination Wallet ID</mat-label>
          <input matInput formControlName="destWalletId" placeholder="Enter wallet ID">
          <app-aegis-form-field-error [form]="form" controlName="destWalletId" [labels]="fieldLabels" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount</mat-label>
          <input matInput type="number" formControlName="amount" placeholder="0.00" [attr.aria-label]="'Amount in ' + data.wallet.currency">
          <span matTextSuffix> {{ data.wallet.currency }}</span>
          <app-aegis-form-field-error [form]="form" controlName="amount" [labels]="fieldLabels" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reference</mat-label>
          <input matInput formControlName="reference" placeholder="Transaction reference">
          <app-aegis-form-field-error [form]="form" controlName="reference" [labels]="fieldLabels" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description (optional)</mat-label>
          <input matInput formControlName="description" placeholder="Optional description">
        </mat-form-field>
      </form>
    </div>

    <div class="dialog-actions">
      <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
      <app-aegis-loading-button
        [label]="resultLabel() ? confirmLabel + ' ' + resultLabel() : confirmLabel"
        variant="primary"
        [disabled]="form.invalid"
        (click)="submit()"
      />
    </div>
  </div>
</div>
