<header class="header">
  <div class="header-left">
    <button class="mobile-menu-btn" (click)="menuToggle.emit()" aria-label="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="mobile-brand" aria-hidden="true">AEGIS</span>
  </div>

  <div class="breadcrumb">
    <span class="breadcrumb-root">Aegis</span>
    <mat-icon class="breadcrumb-sep">chevron_right</mat-icon>
    <span class="breadcrumb-current">{{ currentPage() }}</span>
  </div>

  <div class="header-center">
    <button class="search-trigger" (click)="openSearch()">
      <mat-icon class="search-icon">search</mat-icon>
      <span class="search-placeholder">Search or jump to...</span>
      <span class="search-shortcut">
        <kbd>&#8984;</kbd><kbd>K</kbd>
      </span>
    </button>
  </div>

  <div class="header-right">
    <button class="mobile-search-btn" (click)="openSearch()" aria-label="Search">
      <mat-icon>search</mat-icon>
    </button>
    <span class="env-badge" [class]="environmentClass">{{ environment }}</span>

    <button
      class="user-btn"
      [matMenuTriggerFor]="userMenu"
      aria-label="User menu"
      (menuOpened)="menuOpen.set(true)"
      (menuClosed)="menuOpen.set(false)"
    >
      <span class="user-avatar">{{ userInitials }}</span>
      <mat-icon class="dropdown-arrow">expand_more</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
      @if (userEmail()) {
        <div class="menu-user-info">
          <span class="menu-user-email">{{ userEmail() }}</span>
        </div>
        <mat-divider></mat-divider>
      }
      <button mat-menu-item (click)="navigateTo('/settings')">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</header>
