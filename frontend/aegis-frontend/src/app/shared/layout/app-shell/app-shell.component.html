@if (showShell()) {
  <div class="aegis-shell">
    <a href="#aegis-main-content" class="skip-link">Skip to main content</a>

    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      (collapsedChange)="onSidebarCollapsedChange($event)"
    ></app-sidebar>

    <div class="aegis-main">
      <app-header></app-header>

      <main id="aegis-main-content" class="aegis-content" tabindex="-1">
        <router-outlet [@routeAnimation]="getRouteAnimation()"></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <router-outlet [@routeAnimation]="getRouteAnimation()"></router-outlet>
}

<app-toast-container></app-toast-container>
<app-keyboard-shortcut-cheat-sheet></app-keyboard-shortcut-cheat-sheet>
<app-command-palette></app-command-palette>
