<button
  mat-raised-button
  [color]="variantColor()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class.full-width]="fullWidth()"
  [class]="variant()"
>
    @if (loading()) {
      <mat-spinner [diameter]="spinnerDiameter()" aria-label="Loading"></mat-spinner>
    } @else {
    {{ label() }}
  }
</button>
