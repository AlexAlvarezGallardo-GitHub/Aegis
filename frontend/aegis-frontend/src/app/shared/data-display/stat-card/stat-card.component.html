@if (loading()) {
  <div class="stat-card skeleton">
    <div class="skeleton-line short"></div>
    <div class="skeleton-line long"></div>
  </div>
} @else {
  <div class="stat-card" [class]="variantClass()">
    <div class="stat-header">
      <span class="stat-label">{{ label() }}</span>
      <mat-icon class="stat-icon" aria-hidden="true">{{ icon() }}</mat-icon>
    </div>

    @if (subtitle()) {
      <div class="stat-subtitle">{{ subtitle() }}</div>
    }

    @if (animate()) {
      <div
        class="stat-value"
        [appAegisCountUp]="countUpValue()"
        [duration]="countUpDuration()"
        [prefix]="countUpPrefix()"
        [suffix]="countUpSuffix()"
        [decimals]="countUpDecimals()"
      >0</div>
    } @else {
      <div class="stat-value">{{ value() }}</div>
    }

    @if (trend()) {
      <div class="stat-trend" [class]="trend()">
        <mat-icon class="trend-icon" aria-hidden="true">{{ trendIcon() }}</mat-icon>
        @if (trendValue()) {
          <span class="trend-value">{{ trendValue() }}</span>
        }
      </div>
    }
  </div>
}
