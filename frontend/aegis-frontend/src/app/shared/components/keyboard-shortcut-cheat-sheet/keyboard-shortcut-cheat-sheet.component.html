@if (shortcutsService.showCheatSheet()) {
  <div class="cheat-sheet-overlay" (click)="close()" (keydown.escape)="close()" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" tabindex="-1">
    <div class="cheat-sheet-panel" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
      <div class="cheat-sheet-header">
        <h2 class="cheat-sheet-title">Keyboard Shortcuts</h2>
        <button mat-icon-button (click)="close()" type="button" aria-label="Close shortcuts">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="cheat-sheet-body">
        @for (group of shortcutsService.defaultShortcuts; track group.group) {
          <div class="shortcut-group">
            <h3 class="shortcut-group-title">{{ group.group }}</h3>
            <div class="shortcut-list">
              @for (shortcut of group.shortcuts; track shortcut.keys) {
                <div class="shortcut-row">
                  <span class="shortcut-description">{{ shortcut.description }}</span>
                  <kbd class="shortcut-keys">{{ shortcut.keys }}</kbd>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
