# Gitleaks configuration for the Aegis platform.
# Extends the default rule set and allowlists development-only placeholder values
# that are intentionally present in source (never used in production).

title = "Aegis Gitleaks Config"

[extend]
useDefault = true

[allowlist]
  description = "Development-only placeholder credentials and test fixtures"
  regexes = [
    '''aegis-dev-secret-key''',
    '''aegis_secret''',
    '''aegis-secret''',
    '''change-me''',
    '''your-.*-secret''',
    '''password\s*[:=]\s*["']?aegis''',
    # Truncated example JWT fragments in OpenAPI contracts and specs
    # (e.g. "eyJhbGciOiJSUzI1NiIs..."). These are documentation placeholders,
    # never usable credentials.
    '''eyJ[A-Za-z0-9_-]*\.{2,}''',
    '''eyJ[A-Za-z0-9_-]{8,}\.\s*$''',
  ]
  paths = [
    '''.*/src/test/.*''',
    '''.*/test/.*''',
    '''.*/specs/.*/contracts/.*''',
    '''.*/specs/.*\.md''',
  ]
