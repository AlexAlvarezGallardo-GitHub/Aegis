spring:
  config:
    activate:
      on-profile: dev

aegis:
  payment:
    fraud:
      base-url: http://localhost:8089
      timeout-ms: 3000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
