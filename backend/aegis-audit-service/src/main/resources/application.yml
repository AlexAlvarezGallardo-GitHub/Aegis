server:
  port: 8088

spring:
  application:
    name: aegis-audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_audit
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

aegis:
  kafka:
    topics:
      funds-deposited: wallet.funds.deposited

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aegis.audit: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
