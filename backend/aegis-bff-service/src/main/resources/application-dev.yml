spring:
  session:
    store-type: redis
  data:
    redis:
      host: localhost
      port: 6379

aegis:
  jwt:
    secret: "aegis-dev-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
