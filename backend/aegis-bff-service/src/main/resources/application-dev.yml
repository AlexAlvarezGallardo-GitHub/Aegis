spring:
  session:
    store-type: redis
  data:
    redis:
      host: localhost
      port: 6379

aegis:
  jwt:
    secret: "${JWT_SECRET}"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
