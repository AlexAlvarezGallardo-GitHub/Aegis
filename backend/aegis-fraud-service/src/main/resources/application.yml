server:
  port: 8089

spring:
  application:
    name: aegis-fraud-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_fraud
    username: aegis
    password: aegis_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.aegis.fraud.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

aegis:
  fraud:
    review-threshold: 30
    reject-threshold: 70
  kafka:
    topics:
      fraud-assessment-completed: fraud.assessment.completed

logging:
  level:
    com.aegis: DEBUG
