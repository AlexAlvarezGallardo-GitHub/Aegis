server:
  port: 8081

spring:
  task:
    scheduling:
      observation-enabled: false
  application:
    name: aegis-identity-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_identity
    username: aegis
    password: aegis_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aegis:
  outbox:
    polling-interval-ms: 1000
    batch-size: 50
  kafka:
    topics:
      USER_REGISTERED: aegis.identity.user-registered
      USER_AUTHENTICATED: aegis.identity.user-authenticated
      USER_ACCOUNT_LOCKED: aegis.identity.user-account-locked
  jwt:
    secret: "aegis-dev-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

logging:
  level:
    com.aegis: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  metrics:
    tags:
      application: "${spring.application.name}"
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
