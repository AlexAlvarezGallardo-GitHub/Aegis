server:
  port: 8083

spring:
  application:
    name: aegis-wallet-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_wallet
    username: aegis
    password: aegis_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

aegis:
  wallet:
    max-per-user: 5
    outbox:
      polling-interval-ms: 1000
      batch-size: 50
  kafka:
    topics:
      WALLET_CREATED: aegis.wallet.created
      WALLET_BALANCE_ADJUSTED: aegis.wallet.balance.adjusted
      FUNDS_DEPOSITED: wallet.funds.deposited

logging:
  level:
    com.aegis: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
