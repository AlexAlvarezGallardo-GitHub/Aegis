server:
  port: 8087

spring:
  task:
    scheduling:
      observation-enabled: false
  application:
    name: aegis-reporting-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_reporting
    username: aegis
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aegis.reporting.domain.event
        spring.json.value.default.type: com.aegis.reporting.domain.event.FundsDepositedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

aegis:
  kafka:
    topics:
      funds-deposited: wallet.funds.deposited

logging:
  level:
    com.aegis: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
