server:
  port: 8087

spring:
  application:
    name: aegis-reporting-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_reporting
    username: aegis
    password: aegis_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aegis.reporting.domain.event
        spring.json.value.default.type: com.aegis.reporting.domain.event.FundsDepositedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

aegis:
  kafka:
    topics:
      funds-deposited: wallet.funds.deposited

logging:
  level:
    com.aegis: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
