name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      infra: ${{ steps.changes.outputs.infra }}
      workflows: ${{ steps.changes.outputs.workflows }}
      any: ${{ steps.changes.outputs.any }}
      common: ${{ steps.changes.outputs.common }}
      identity: ${{ steps.changes.outputs.identity }}
      wallet: ${{ steps.changes.outputs.wallet }}
      bff: ${{ steps.changes.outputs.bff }}
      audit: ${{ steps.changes.outputs.audit }}
      fraud: ${{ steps.changes.outputs.fraud }}
      reporting: ${{ steps.changes.outputs.reporting }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          filters: |
            backend:
              - 'backend/**'
            common:
              - 'backend/aegis-common/**'
            identity:
              - 'backend/aegis-identity-service/**'
            wallet:
              - 'backend/aegis-wallet-service/**'
            bff:
              - 'backend/aegis-bff-service/**'
            audit:
              - 'backend/aegis-audit-service/**'
            fraud:
              - 'backend/aegis-fraud-service/**'
            reporting:
              - 'backend/aegis-reporting-service/**'
            frontend:
              - 'frontend/aegis-frontend/**'
            e2e:
              - 'e2e/**'
            infra:
              - 'infra/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            any:
              - 'backend/**'
              - 'frontend/aegis-frontend/**'
              - 'e2e/**'
              - 'infra/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  validate-branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          TYPES="feature|fix|chore|refactor|docs|test|ci|security"
          PATTERN="^($TYPES)/[0-9]+-[a-z0-9-]+$"

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Branch name '$BRANCH' does not follow convention."
            echo "Expected: <type>/<number>-<short-description>"
            echo "Types: $TYPES"
            exit 1
          fi
          echo "Branch name '$BRANCH' is valid."

  validate-commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          TYPES="feat|fix|refactor|test|docs|chore|ci|perf|security"
          SCOPES="identity|wallet|payment|fraud|notification|audit|reporting|gateway|infra|frontend"
          PATTERN="^($TYPES)\(($SCOPES)\)!?: .{1,72}$"

          FAILED=0
          while IFS= read -r MSG; do
            if [[ "$MSG" =~ ^(Merge|Revert)\  ]]; then
              continue
            fi
            if [[ ! "$MSG" =~ $PATTERN ]]; then
              echo "::error::Invalid commit message: $MSG"
              FAILED=1
            fi
          done < <(git log --format=%s origin/main..HEAD)

          if [ "$FAILED" -eq 1 ]; then
            echo "Expected format: <type>(<scope>): <description>"
            exit 1
          fi
          echo "All commit messages are valid."

  validate-pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          TYPES="feat|fix|refactor|test|docs|chore|ci|perf|security"
          SCOPES="identity|wallet|payment|fraud|notification|audit|reporting|gateway|infra|frontend"
          PATTERN="^($TYPES)\(($SCOPES)\)!?: .{1,72}$"

          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title '$TITLE' does not follow convention."
            echo "Expected: <type>(<scope>): <description>"
            exit 1
          fi
          echo "PR title '$TITLE' is valid."

  validate-pr-body:
    name: PR Body
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          FAILED=0
          if ! echo "$BODY" | grep -qi "summary"; then
            echo "::error::PR body missing 'Summary' section"
            FAILED=1
          fi
          if ! echo "$BODY" | grep -qi "changes"; then
            echo "::error::PR body missing 'Changes' section"
            FAILED=1
          fi
          if ! echo "$BODY" | grep -qi "testing"; then
            echo "::error::PR body missing 'Testing' section"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "PR body must include: Summary, Changes, Testing sections"
            exit 1
          fi
          echo "PR body has all required sections."

  check-links:
    name: Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee on markdown and YAML documentation
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress --max-concurrency 8
            '**/*.md' 'specs/**/contracts/*.yaml' '.github/**/*.yml' '.github/**/*.yaml'
            --exclude '^(https://github\.com/AlexAlvarezGallardo-GitHub/.*/blob/|https://img\.shields\.io|mailto:)'
            --exclude '^(https?://(api|bff|wallet|identity|fraud|audit|reporting)\.aegis\.dev|https?://aegis-[a-z-]+:[0-9]+/)'
            --exclude '^https?://localhost:[0-9]+'
            --exclude '^https?://host\.docker\.internal:[0-9]+'
            --exclude '^https://(github|img|raw)/'
            --exclude '^https://raw\.githubusercontent\.com/AlexAlvarezGallardo-GitHub/Aegis/gh-pages/'
            --exclude-path 'node_modules/'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail on broken links
        if: ${{ steps.lychee.outputs.exit_code != 0 }}
        run: |
          echo "::error::Broken links detected. See the lychee report above."
          exit 1

  backend-build:
    name: Backend Build (${{ matrix.service.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - module: aegis-identity-service
            filter: identity
          - module: aegis-wallet-service
            filter: wallet
          - module: aegis-bff-service
            filter: bff
          - module: aegis-audit-service
            filter: audit
          - module: aegis-fraud-service
            filter: fraud
          - module: aegis-reporting-service
            filter: reporting
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        if: ${{ needs.detect-changes.outputs[matrix.service.filter] == 'true' || needs.detect-changes.outputs.common == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Compile and test
        if: ${{ needs.detect-changes.outputs[matrix.service.filter] == 'true' || needs.detect-changes.outputs.common == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        working-directory: backend
        run: |
          mvn -B -q -pl ${{ matrix.service.module }} -am \
            -DskipITs \
            -Djacoco.skip=false \
            verify
      - name: Upload coverage
        if: ${{ (needs.detect-changes.outputs[matrix.service.filter] == 'true' || needs.detect-changes.outputs.common == 'true') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.module }}
          path: backend/${{ matrix.service.module }}/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload surefire reports
        if: ${{ (needs.detect-changes.outputs[matrix.service.filter] == 'true' || needs.detect-changes.outputs.common == 'true') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service.module }}
          path: backend/${{ matrix.service.module }}/target/surefire-reports/
          if-no-files-found: ignore

  backend-build-check:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-build
    if: always()
    steps:
      - name: Report backend build result
        run: |
          RESULT="${{ needs.backend-build.result }}"
          echo "Backend build matrix result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "::error::Backend build failed: $RESULT"
            exit 1
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend/aegis-frontend
      - name: Lint
        working-directory: frontend/aegis-frontend
        run: npm run lint
      - name: Build
        working-directory: frontend/aegis-frontend
        run: npm run build

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend/aegis-frontend
      - name: Unit tests
        working-directory: frontend/aegis-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  perf-check:
    name: Performance Check (k6)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.identity == 'true' || needs.detect-changes.outputs.wallet == 'true' || needs.detect-changes.outputs.bff == 'true' || needs.detect-changes.outputs.common == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare infra env
        run: cp infra/.env.example infra/.env
      - name: Build service images
        run: docker compose -f infra/docker-compose.yml build aegis-identity aegis-wallet aegis-bff aegis-audit aegis-fraud aegis-reporting aegis-frontend
      - name: Start the full stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for Identity and BFF readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health >/dev/null && break
            sleep 5
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/actuator/health >/dev/null && break
            sleep 5
          done
      - name: Seed perf users
        run: |
          for i in $(seq 1 10); do
            curl -sf -X POST http://localhost:8081/api/v1/users/register -H 'Content-Type: application/json' \
              -d "{\"email\":\"perfuser$i@aegis.test\",\"password\":\"LoadTest123!\",\"firstName\":\"Perf\",\"lastName\":\"User$i\"}" >/dev/null || true
          done
      - name: Run k6 perf smoke
        run: |
          docker run --rm -v "$PWD/load:/scripts" grafana/k6:latest run \
            --summary-export /scripts/perf-pr.json \
            /scripts/k6/perf.js -e BASE_URL=http://host.docker.internal:8082 -e USER_PREFIX=perfuser
      - name: Download main baseline
        run: |
          mkdir -p baseline
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&workflow_id=ci.yml&status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null)
          ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name=="perf-baseline") | .id' 2>/dev/null)
          if [ -n "$ARTIFACT" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > baseline.zip
            unzip -o baseline.zip -d baseline
            echo "BASELINE=1" >> "$GITHUB_ENV"
          else
            echo "BASELINE=0" >> "$GITHUB_ENV"
          fi
      - name: Compare against baseline
        id: compare
        env:
          BASELINE: ${{ env.BASELINE }}
        run: |
          if [ "$BASELINE" = "1" ]; then
            python scripts/perf-check.py --summary load/perf-pr.json \
              --baseline baseline/perf-baseline.json --threshold 1.25 -o perf-report.md
            echo "PERF_RC=$?" >> "$GITHUB_ENV"
            [ "$PERF_RC" = "0" ] || true
          else
            echo "No perf baseline available yet (first main run with the perf job). Skipping comparison." > perf-report.md
            echo "PERF_RC=0" >> "$GITHUB_ENV"
          fi
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('perf-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot = comments.find(c => c.user.type === 'Bot' && c.body.includes('## Performance Check'));
            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: bot.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail on regression
        if: ${{ env.PERF_RC != '0' }}
        run: |
          echo "::error::Performance regression detected (PR p95 > baseline × 1.25)"
          exit 1
      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.e2e == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare infra env
        run: cp infra/.env.example infra/.env
      - name: Build service images
        run: docker compose -f infra/docker-compose.yml build aegis-identity aegis-wallet aegis-bff aegis-audit aegis-fraud aegis-reporting aegis-frontend
      - name: Start the full stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for BFF and Identity readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/actuator/health >/dev/null; then
              echo "BFF ready after $((i*5))s"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:8082/actuator/health || {
            echo "::error::BFF never became ready"
            docker compose -f infra/docker-compose.yml logs --tail=120
            exit 1
          }
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health >/dev/null; then
              echo "Identity ready after $((i*5))s"
              break
            fi
            sleep 5
          done
      - name: Seed E2E user
        run: |
          echo "Registering E2E user..."
          for i in $(seq 1 12); do
            if curl -sf -X POST http://localhost:8081/api/v1/users/register \
              -H 'Content-Type: application/json' \
              -d '{"email":"alex@aegis.test","password":"StrongPass123!","firstName":"Alex","lastName":"Test"}'; then
              echo "E2E user registered"
              break
            fi
            echo "registration attempt ${i} failed, retrying..."
            sleep 5
          done
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report-pr
          path: |
            e2e/playwright-report/
            evidence/html-report/
            evidence/e2e/
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - backend-build
      - frontend-build
      - frontend-tests
      - e2e-tests
    if: always()
    steps:
      - name: Publish summary
        uses: actions/github-script@v7
        env:
          BACKEND: ${{ needs.backend-build.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          E2E: ${{ needs.e2e-tests.result }}
          CHANGES: ${{ toJson(needs.detect-changes.outputs) }}
        with:
          script: |
            const changes = JSON.parse(process.env.CHANGES || '{}');
            const backend = process.env.BACKEND || 'skipped';
            const frontendBuild = process.env.FRONTEND_BUILD || 'skipped';
            const frontendTests = process.env.FRONTEND_TESTS || 'skipped';
            const e2e = process.env.E2E || 'skipped';

            const status = (result) => {
              if (result === 'success') return '✅ success';
              if (result === 'failure') return '❌ failure';
              if (result === 'cancelled') return '🚫 cancelled';
              if (result === 'skipped') return '⏭️ skipped';
              return `⏳ ${result}`;
            };

            const body = [
              '## PR Validation Summary',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Detected backend changes | ${changes.backend === 'true' ? 'yes' : 'no'} |`,
              `| Detected frontend changes | ${changes.frontend === 'true' ? 'yes' : 'no'} |`,
              `| Backend build | ${status(backend)} |`,
              `| Frontend build | ${status(frontendBuild)} |`,
              `| Frontend unit tests | ${status(frontendTests)} |`,
              `| E2E tests | ${status(e2e)} |`,
              '',
              '> Target feedback time: 30–60 seconds for validation jobs with warm cache.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('PR Validation Summary'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: test-reports
          pattern: 'surefire-*'
          merge-multiple: true
      - name: Generate test report
        env:
          BRANCH: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/test-report.py test-reports \
            --branch "$BRANCH" \
            --commit "$COMMIT" \
            -o test-report.md || true
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('test-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('## Test Report'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
