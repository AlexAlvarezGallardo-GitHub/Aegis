name: Security

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

  sbom-repo:
    name: Repository SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: aegis-repo-sbom.spdx.json
          format: spdx-json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aegis-repo-sbom
          path: aegis-repo-sbom.spdx.json

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, codeql, trivy-filesystem, sbom-repo]
    if: always()
    steps:
      - name: Write summary
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJson(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS || '{}');
            const lines = ['| Job | Result |', '|-----|--------|'];
            for (const [job, data] of Object.entries(results)) {
              const result = data.result || 'unknown';
              const icon = result === 'success' ? '✅' : result === 'failure' ? '❌' : result === 'cancelled' ? '🚫' : '⏳';
              lines.push(`| ${job} | ${icon} ${result} |`);
            }
            await core.summary.addRaw(lines.join('\n')).write();
