name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: aegis

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      infra: ${{ steps.changes.outputs.infra }}
      workflows: ${{ steps.changes.outputs.workflows }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/aegis-frontend/**'
            e2e:
              - 'e2e/**'
            infra:
              - 'infra/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            any:
              - 'backend/**'
              - 'frontend/aegis-frontend/**'
              - 'e2e/**'
              - 'infra/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  backend-full-build:
    name: Backend Full Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Build, test and coverage
        working-directory: backend
        run: mvn -B verify
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Integration tests
        working-directory: backend
        run: mvn -B verify -Pintegration-tests

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Run PIT on critical modules
        working-directory: backend
        run: |
          mvn -B -q install -DskipTests -pl aegis-common
          mvn -B -pl aegis-identity-service,aegis-wallet-service,aegis-fraud-service \
            -DskipITs \
            -Pmutation-testing \
            org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: backend/**/target/pit-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend/aegis-frontend
      - name: Lint
        working-directory: frontend/aegis-frontend
        run: npm run lint
      - name: Build
        working-directory: frontend/aegis-frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend/aegis-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  docker-build-push:
    name: Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-full-build, frontend-build]
    if: always() && (needs.backend-full-build.result == 'success' || needs.frontend-build.result == 'success') && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            image: identity-service
            context: backend
            file: backend/aegis-identity-service/Dockerfile
            filter: backend
          - name: wallet
            image: wallet-service
            context: backend
            file: backend/aegis-wallet-service/Dockerfile
            filter: backend
          - name: bff
            image: bff-service
            context: backend
            file: backend/aegis-bff-service/Dockerfile
            filter: backend
          - name: audit
            image: audit-service
            context: backend
            file: backend/aegis-audit-service/Dockerfile
            filter: backend
          - name: fraud
            image: fraud-service
            context: backend
            file: backend/aegis-fraud-service/Dockerfile
            filter: backend
          - name: reporting
            image: reporting-service
            context: backend
            file: backend/aegis-reporting-service/Dockerfile
            filter: backend
          - name: frontend
            image: frontend
            context: frontend/aegis-frontend
            file: frontend/aegis-frontend/Dockerfile
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: ./.github/actions/docker-build-push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          image: ${{ matrix.image }}
          tags: ${{ github.sha }},latest
          push: 'true'

  security-scan:
    name: Trivy Security Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'
          ignore-unfixed: true
      - name: Upload Trivy scan results
        if: ${{ (needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true') && always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'

  sbom:
    name: Generate SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM with Syft (CycloneDX)
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          output-file: ${{ matrix.image }}-sbom.cdx.json
          format: cyclonedx-json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM
        if: ${{ (needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-sbom
          path: ${{ matrix.image }}-sbom.cdx.json

  cosign-sign:
    name: Cosign Sign (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image (keyless via GitHub OIDC)
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        run: |
          IMAGE="ghcr.io/$GHCR_OWNER/${{ matrix.image }}:${{ github.sha }}"
          cosign sign --yes "$IMAGE"

  gitops-update:
    name: Update GitOps (DEV)
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: ${{ always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') && needs.docker-build-push.result != 'failure' && needs.docker-build-push.result != 'cancelled' }}
    permissions:
      contents: read
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: AlexAlvarezGallardo-GitHub/Aegis-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: aegis-gitops
      - name: Update image tags
        working-directory: aegis-gitops
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|g" overlays/dev/*-values.yaml
          git diff --stat
      - name: Commit and push
        working-directory: aegis-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/*-values.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to push."
            exit 0
          fi
          git commit -m "chore(infra): update dev image tags to ${{ github.sha }}"
          git push

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-full-build
      - backend-integration-tests
      - mutation-testing
      - frontend-build
      - docker-build-push
      - sbom
      - security-scan
      - cosign-sign
      - gitops-update
    if: always()
    steps:
      - name: Write summary
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJson(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS || '{}');
            const lines = ['| Job | Result |', '|-----|--------|'];
            for (const [job, data] of Object.entries(results)) {
              const result = data.result || 'unknown';
              const icon = result === 'success' ? '✅' : result === 'failure' ? '❌' : result === 'cancelled' ? '🚫' : '⏳';
              lines.push(`| ${job} | ${icon} ${result} |`);
            }
            const summary = lines.join('\n');
            await core.summary.addRaw(summary).write();
