name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  backend-build:
    name: Backend build + tests + coverage + checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn verify -am
        working-directory: backend

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn verify -Pintegration-tests -am
        working-directory: backend

  frontend-build:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npm run build
        working-directory: frontend/aegis-frontend
      - run: npm run lint
        working-directory: frontend/aegis-frontend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend/aegis-frontend

  e2e-tests:
    name: E2E tests (Playwright install check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Verify Playwright config compiles
        working-directory: e2e
        run: npx playwright test --list

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images sequentially
        shell: bash
        run: |
          set -e
          declare -A IMAGES
          IMAGES["aegis-identity"]="backend|aegis-identity-service/Dockerfile"
          IMAGES["aegis-wallet"]="backend|aegis-wallet-service/Dockerfile"
          IMAGES["aegis-bff"]="backend|aegis-bff-service/Dockerfile"
          IMAGES["aegis-frontend"]="frontend/aegis-frontend|Dockerfile"
          for key in "${!IMAGES[@]}"; do
            IFS='|' read -r ctx dockerfile <<< "${IMAGES[$key]}"
            echo "Building $key (context=$ctx, dockerfile=$dockerfile)"
            docker build --file "$ctx/$dockerfile" --tag "$key:ci-${{ github.sha }}" "$ctx"
          done

  security-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
