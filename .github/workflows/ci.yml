name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: aegis

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      infra: ${{ steps.changes.outputs.infra }}
      workflows: ${{ steps.changes.outputs.workflows }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/aegis-frontend/**'
            e2e:
              - 'e2e/**'
            infra:
              - 'infra/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            any:
              - 'backend/**'
              - 'frontend/aegis-frontend/**'
              - 'e2e/**'
              - 'infra/**'
              - '.github/workflows/**'
              - '.github/actions/**'

  backend-full-build:
    name: Backend Full Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Build, test and coverage
        working-directory: backend
        run: mvn -B verify
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Integration tests
        working-directory: backend
        run: mvn -B verify -Pintegration-tests

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          working-directory: backend
      - name: Run PIT on critical modules
        working-directory: backend
        run: |
          mvn -B -q install -DskipTests -pl aegis-common -am
          mvn -B -pl aegis-identity-service,aegis-wallet-service,aegis-fraud-service \
            -DskipITs -DskipTests \
            test-compile
          mvn -B -pl aegis-identity-service,aegis-wallet-service,aegis-fraud-service \
            -DskipITs \
            -Pmutation-testing \
            org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: backend/**/target/pit-reports/
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend/aegis-frontend
      - name: Lint
        working-directory: frontend/aegis-frontend
        run: npm run lint
      - name: Build
        working-directory: frontend/aegis-frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend/aegis-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  docker-build-push:
    name: Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-full-build, frontend-build]
    if: always() && (needs.backend-full-build.result == 'success' || needs.frontend-build.result == 'success') && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.workflows == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            image: identity-service
            context: backend
            file: backend/aegis-identity-service/Dockerfile
            filter: backend
          - name: wallet
            image: wallet-service
            context: backend
            file: backend/aegis-wallet-service/Dockerfile
            filter: backend
          - name: bff
            image: bff-service
            context: backend
            file: backend/aegis-bff-service/Dockerfile
            filter: backend
          - name: audit
            image: audit-service
            context: backend
            file: backend/aegis-audit-service/Dockerfile
            filter: backend
          - name: fraud
            image: fraud-service
            context: backend
            file: backend/aegis-fraud-service/Dockerfile
            filter: backend
          - name: reporting
            image: reporting-service
            context: backend
            file: backend/aegis-reporting-service/Dockerfile
            filter: backend
          - name: frontend
            image: frontend
            context: frontend/aegis-frontend
            file: frontend/aegis-frontend/Dockerfile
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: ./.github/actions/docker-build-push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          image: ${{ matrix.image }}
          tags: ${{ github.sha }},latest
          push: 'true'

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: ${{ always() && needs.docker-build-push.result != 'failure' && needs.docker-build-push.result != 'cancelled' && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.e2e == 'true' || needs.detect-changes.outputs.workflows == 'true') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare infra env
        run: cp infra/.env.example infra/.env
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Determine image tag
        id: img
        run: |
          if [ "${{ needs.docker-build-push.result }}" = "success" ]; then
            echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and tag service images
        run: |
          TAG="${{ steps.img.outputs.TAG }}"
          pull_with_fallback() {
            local image="$1"
            local local_name="$2"
            for attempt in 1 2 3; do
              if docker pull "$image:$TAG"; then
                docker tag "$image:$TAG" "$local_name:latest"
                return 0
              fi
              echo "pull of $image:$TAG failed (attempt $attempt/3); retrying..."
              sleep 5
            done
            # Image for this service was not built in this run (filter did not change).
            # Fall back to the last published 'latest' tag.
            echo "::warning::$image:$TAG not found; falling back to :latest"
            docker pull "$image:latest"
            docker tag "$image:latest" "$local_name:latest"
          }
          for svc in identity wallet bff audit fraud reporting; do
            pull_with_fallback "ghcr.io/$GHCR_OWNER/$svc-service" "infra-aegis-$svc"
          done
          pull_with_fallback "ghcr.io/$GHCR_OWNER/frontend" "infra-aegis-frontend"
      - name: Start the full stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for BFF readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/actuator/health >/dev/null; then
              echo "BFF ready after $((i*5))s"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:8082/actuator/health || {
            echo "::error::BFF never became ready"
            docker compose -f infra/docker-compose.yml logs --tail=120
            exit 1
          }
      - name: Seed E2E user
        run: |
          echo "Waiting for Identity service..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health >/dev/null; then
              echo "Identity ready after $((i*5))s"
              break
            fi
            sleep 5
          done
          echo "Registering E2E user..."
          for i in $(seq 1 12); do
            if curl -sf -X POST http://localhost:8081/api/v1/users/register \
              -H 'Content-Type: application/json' \
              -d '{"email":"alex@aegis.test","password":"StrongPass123!","firstName":"Alex","lastName":"Test"}'; then
              echo "E2E user registered"
              break
            fi
            echo "registration attempt ${i} failed, retrying..."
            sleep 5
          done
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            e2e/playwright-report/
            evidence/html-report/
            evidence/e2e/
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  perf-baseline:
    name: Performance Baseline (k6)
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: ${{ always() && needs.docker-build-push.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare infra env
        run: cp infra/.env.example infra/.env
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and tag service images
        run: |
          for svc in identity wallet bff audit fraud reporting; do
            docker pull "ghcr.io/$GHCR_OWNER/$svc-service:${{ github.sha }}"
            docker tag  "ghcr.io/$GHCR_OWNER/$svc-service:${{ github.sha }}" "infra-aegis-$svc:latest"
          done
          docker pull "ghcr.io/$GHCR_OWNER/frontend:${{ github.sha }}"
          docker tag  "ghcr.io/$GHCR_OWNER/frontend:${{ github.sha }}" "infra-aegis-frontend:latest"
      - name: Start the full stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for Identity and BFF readiness
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health >/dev/null && break
            sleep 5
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/actuator/health >/dev/null && break
            sleep 5
          done
      - name: Seed perf users
        run: |
          for i in $(seq 1 10); do
            curl -sf -X POST http://localhost:8081/api/v1/users/register -H 'Content-Type: application/json' \
              -d "{\"email\":\"perfuser$i@aegis.test\",\"password\":\"LoadTest123!\",\"firstName\":\"Perf\",\"lastName\":\"User$i\"}" >/dev/null || true
          done
      - name: Run k6 perf smoke
        run: |
          docker run --rm -v "$PWD/load:/scripts" grafana/k6:latest run \
            --summary-export /scripts/perf-baseline.json \
            /scripts/k6/perf.js -e BASE_URL=http://host.docker.internal:8082 -e USER_PREFIX=perfuser
      - name: Upload perf baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: load/perf-baseline.json
      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  security-scan:
    name: Trivy Security Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image }}.sarif'
          ignore-unfixed: true
      - name: Upload Trivy scan results
        if: ${{ (needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true') && always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.image }}.sarif'

  sbom:
    name: Generate SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM with Syft (CycloneDX)
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          output-file: ${{ matrix.image }}-sbom.cdx.json
          format: cyclonedx-json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM
        if: ${{ (needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-sbom
          path: ${{ matrix.image }}-sbom.cdx.json

  cosign-sign:
    name: Cosign Sign (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always() && needs.docker-build-push.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-service
            filter: backend
          - image: wallet-service
            filter: backend
          - image: bff-service
            filter: backend
          - image: audit-service
            filter: backend
          - image: fraud-service
            filter: backend
          - image: reporting-service
            filter: backend
          - image: frontend
            filter: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Compute GHCR owner
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image (keyless via GitHub OIDC)
        if: ${{ needs.detect-changes.outputs[matrix.filter] == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
        run: |
          IMAGE="ghcr.io/$GHCR_OWNER/${{ matrix.image }}:${{ github.sha }}"
          cosign sign --yes "$IMAGE"

  gitops-update:
    name: Update GitOps (DEV) via PR
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: ${{ always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') && needs.docker-build-push.result != 'failure' && needs.docker-build-push.result != 'cancelled' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: AlexAlvarezGallardo-GitHub/Aegis-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: aegis-gitops
          ref: main
      - name: Update image tags
        working-directory: aegis-gitops
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|g" overlays/dev/*-values.yaml
          git diff --stat
      - name: Validate Helm templates
        working-directory: aegis-gitops
        run: |
          if command -v helm >/dev/null 2>&1; then
            for d in charts/*/; do
              helm template "$(basename "$d")" "$d" -f overlays/dev/$(basename "$d")-values.yaml > /dev/null 2>&1 \
                || echo "::warning::helm template failed for $d (chart may require cluster context)"
            done
          else
            echo "helm not installed; skipping template validation"
          fi
      - name: Commit and open PR
        working-directory: aegis-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/update-dev-image-tags-${{ github.sha }}
          git add overlays/dev/*-values.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi
          git commit -m "chore(infra): update dev image tags to ${{ github.sha }}"
          git push origin ci/update-dev-image-tags-${{ github.sha }}

          # Open (or reuse) a PR instead of pushing directly to main
          PR_URL=$(gh api "repos/AlexAlvarezGallardo-GitHub/Aegis-GitOps/pulls" \
            -f title="chore(infra): update dev image tags to ${{ github.sha }}" \
            -f head="ci/update-dev-image-tags-${{ github.sha }}" \
            -f base="main" \
            -f body="Automated image tag promotion from Aegis CI. See commit ${{ github.sha }}." \
            --jq '.html_url')
          echo "Opened GitOps PR: $PR_URL"
          echo "GITOPS_PR_URL=$PR_URL" >> "$GITHUB_ENV"
      - name: Approve and merge GitOps PR
        working-directory: aegis-gitops
        env:
          GITOPS_PR_URL: ${{ env.GITOPS_PR_URL }}
        run: |
          if [ -z "$GITOPS_PR_URL" ]; then
            echo "No PR to merge."
            exit 0
          fi
          PR_NUM=${GITOPS_PR_URL##*/}
          # Require the PR to be green, then squash-merge
          gh pr merge "$PR_NUM" --repo AlexAlvarezGallardo-GitHub/Aegis-GitOps \
            --squash --delete-branch
          echo "Merged GitOps PR #$PR_NUM"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-full-build
      - backend-integration-tests
      - mutation-testing
      - frontend-build
      - docker-build-push
      - e2e
      - perf-baseline
      - sbom
      - security-scan
      - cosign-sign
      - gitops-update
    if: always()
    steps:
      - name: Write summary
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJson(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS || '{}');
            const lines = ['| Job | Result |', '|-----|--------|'];
            for (const [job, data] of Object.entries(results)) {
              const result = data.result || 'unknown';
              const icon = result === 'success' ? '✅' : result === 'failure' ? '❌' : result === 'cancelled' ? '🚫' : '⏳';
              lines.push(`| ${job} | ${icon} ${result} |`);
            }
            const summary = lines.join('\n');
            await core.summary.addRaw(summary).write();
