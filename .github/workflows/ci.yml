name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  validate-branch:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - run: |
          BRANCH="${{ github.head_ref }}"
          if ! echo "$BRANCH" | grep -qE '^(feature|fix|chore|refactor|docs|test|ci|security)/'; then
            echo "❌ Invalid branch name: $BRANCH"
            echo "Expected: <type>/<description>"
            echo "Types: feature|fix|chore|refactor|docs|test|ci|security"
            exit 1
          fi
          echo "✅ Branch name valid: $BRANCH"

  validate-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git log origin/${{ github.base_ref }}..HEAD --oneline --format="%s" | while read line; do
            if ! echo "$line" | grep -qE '^(feat|fix|refactor|test|docs|chore|ci|perf|security)\((identity|wallet|payment|fraud|notification|audit|reporting|gateway|infra|frontend)\): '; then
              echo "❌ Invalid commit: $line"
              echo "Expected: <type>(<scope>): <description>"
              exit 1
            fi
          done
          echo "✅ All commit messages valid"

  backend-build:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn compile -am
        working-directory: backend
      - run: mvn test -am
        working-directory: backend
      - run: mvn checkstyle:check -am
        working-directory: backend
        continue-on-error: true

  frontend-build:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npm run build
        working-directory: frontend/aegis-frontend
      - run: npm run lint
        working-directory: frontend/aegis-frontend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend/aegis-frontend
