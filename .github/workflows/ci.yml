name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  backend-build:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn compile -am
        working-directory: backend
      - run: mvn test -am
        working-directory: backend
      - run: mvn checkstyle:check -am
        working-directory: backend

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn verify -Pintegration-tests -am
        working-directory: backend

  frontend-build:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npm run build
        working-directory: frontend/aegis-frontend
      - run: npm run lint
        working-directory: frontend/aegis-frontend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/aegis-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/aegis-frontend
      - run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend/aegis-frontend
