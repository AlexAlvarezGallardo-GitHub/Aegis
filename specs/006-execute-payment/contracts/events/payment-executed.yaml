event: PaymentExecuted
topic: payment.executed
schemaVersion: "1.0"
producer: aegis-payment-service
consumers:
  - aegis-audit-service       # audit trail
  - aegis-reporting-service   # payment projections
  # future: aegis-notification-service (payment confirmation)

headers:
  contentType: application/json
  eventType: PAYMENT_EXECUTED

payload:
  eventId:
    type: string
    format: uuid
  eventType:
    type: string
    enum: [PAYMENT_EXECUTED]
  schemaVersion:
    type: string
    example: "1.0"
  occurredAt:
    type: string
    format: date-time
  causationId:
    type: string
    format: uuid
    nullable: true
  correlationId:
    type: string
  aggregateId:
    type: string
    format: uuid
    description: Identifier of the aggregate (the payment)
  aggregateType:
    type: string
    enum: [PAYMENT]
  paymentId:
    type: string
    format: uuid
  walletId:
    type: string
    format: uuid
  userId:
    type: string
    format: uuid
  amount:
    type: number
    format: decimal
  currency:
    type: string
    pattern: "^[A-Z]{3}$"
  payee:
    type: object
    properties:
      name:
        type: string
      id:
        type: string
      type:
        type: string
        enum: [MERCHANT, INDIVIDUAL, SERVICE]
  description:
    type: string
    nullable: true
  reference:
    type: string
  fraudAssessmentId:
    type: string
    format: uuid
  holdId:
    type: string
    format: uuid
    description: Settled hold that reserved the funds
  newBalance:
    type: number
    format: decimal
    description: Wallet balance after payment
  timestamp:
    type: string
    format: date-time
