event: PaymentFailed
topic: payment.failed
schemaVersion: "1.0"
producer: aegis-payment-service
consumers:
  - aegis-audit-service       # audit trail (failures are auditable too)
  - aegis-reporting-service   # failure metrics / projections
  # future: aegis-notification-service (failure notification to payer)

headers:
  contentType: application/json
  eventType: PAYMENT_FAILED

payload:
  eventId:
    type: string
    format: uuid
  eventType:
    type: string
    enum: [PAYMENT_FAILED]
  schemaVersion:
    type: string
    example: "1.0"
  occurredAt:
    type: string
    format: date-time
  causationId:
    type: string
    format: uuid
    nullable: true
  correlationId:
    type: string
  aggregateId:
    type: string
    format: uuid
    description: Identifier of the aggregate (the payment)
  aggregateType:
    type: string
    enum: [PAYMENT]
  paymentId:
    type: string
    format: uuid
  walletId:
    type: string
    format: uuid
  userId:
    type: string
    format: uuid
  amount:
    type: number
    format: decimal
  currency:
    type: string
    pattern: "^[A-Z]{3}$"
  reference:
    type: string
  failureReason:
    type: string
    enum: [FRAUD_REJECTED, FRAUD_UNAVAILABLE, INSUFFICIENT_FUNDS, WALLET_NOT_ACTIVE, WALLET_NOT_FOUND, CURRENCY_MISMATCH, SETTLEMENT_FAILED, HOLD_EXPIRED]
  failureDetails:
    type: string
    nullable: true
  fraudAssessmentId:
    type: string
    format: uuid
    nullable: true
  compensated:
    type: boolean
    description: True when a created hold was released (or never created); guarantees no funds remain locked
  timestamp:
    type: string
    format: date-time
