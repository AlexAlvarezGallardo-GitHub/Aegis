services:
  # ── Databases ──────────────────────────────────────────
  postgres-identity:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-identity
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-wallet:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-wallet
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_wallet
    ports:
      - "5433:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-reporting:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-reporting
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_reporting
    ports:
      - "5434:5432"
    volumes:
      - postgres_reporting_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-audit:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-audit
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_audit
    ports:
      - "5435:5432"
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-fraud:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-fraud
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_fraud
    ports:
      - "5436:5432"
    volumes:
      - postgres_fraud_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16.4-alpine
    container_name: aegis-postgres-payment
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in infra/.env (copy .env.example)}
      POSTGRES_DB: aegis_payment
    ports:
      - "5437:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: redis-server --databases 1
    ports:
      - "6379:6379"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegis-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - aegis-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegis-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aegis-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aegis-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - aegis-network

  # ── Microservices ──────────────────────────────────────
  aegis-identity:
    build:
      context: ../backend
      dockerfile: aegis-identity-service/Dockerfile
    container_name: aegis-identity
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/aegis_identity
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  aegis-wallet:
    build:
      context: ../backend
      dockerfile: aegis-wallet-service/Dockerfile
    container_name: aegis-wallet
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-wallet:5432/aegis_wallet
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-wallet:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  aegis-bff:
    build:
      context: ../backend
      dockerfile: aegis-bff-service/Dockerfile
    container_name: aegis-bff
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AEGIS_IDENTITY_SERVICE_URL: http://aegis-identity:8081
      AEGIS_WALLET_SERVICE_URL: http://aegis-wallet:8083
      AEGIS_PAYMENT_SERVICE_URL: http://aegis-payment:8084
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in infra/.env (copy .env.example)}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      aegis-identity:
        condition: service_started
      aegis-wallet:
        condition: service_started
      aegis-payment:
        condition: service_started
    networks:
      - aegis-network

  aegis-reporting:
    build:
      context: ../backend
      dockerfile: aegis-reporting-service/Dockerfile
    container_name: aegis-reporting
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-reporting:5432/aegis_reporting
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-reporting:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  aegis-audit:
    build:
      context: ../backend
      dockerfile: aegis-audit-service/Dockerfile
    container_name: aegis-audit
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-audit:5432/aegis_audit
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-audit:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  aegis-fraud:
    build:
      context: ../backend
      dockerfile: aegis-fraud-service/Dockerfile
    container_name: aegis-fraud
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fraud:5432/aegis_fraud
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-fraud:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  aegis-payment:
    build:
      context: ../backend
      dockerfile: aegis-payment-service/Dockerfile
    container_name: aegis-payment
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/aegis_payment
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in infra/.env (copy .env.example)}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - aegis-network

  # ── Frontend ────────────────────────────────────────────
  aegis-frontend:
    build:
      context: ../frontend/aegis-frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    ports:
      - "4200:80"
    depends_on:
      - aegis-bff
    networks:
      - aegis-network

  # ── Admin Tools ─────────────────────────────────────────
  dbgate:
    image: dbgate/dbgate:6.2.0
    container_name: aegis-dbgate
    ports:
      - "3000:3000"
    environment:
      CONNECTIONS: identity,wallet,reporting,audit,fraud,payment,redis
      LABEL_identity: Aegis Identity DB
      SERVER_identity: postgres-identity
      PORT_identity: 5432
      USER_identity: aegis
      PASSWORD_identity: ${DBGATE_PASSWORD_IDENTITY:?DBGATE_PASSWORD_IDENTITY must be set in infra/.env (copy .env.example)}
      DATABASE_identity: aegis_identity
      ENGINE_identity: "postgres@dbgate-plugin-postgres"
      LABEL_wallet: Aegis Wallet DB
      SERVER_wallet: postgres-wallet
      PORT_wallet: 5432
      USER_wallet: aegis
      PASSWORD_wallet: ${DBGATE_PASSWORD_WALLET:?DBGATE_PASSWORD_WALLET must be set in infra/.env (copy .env.example)}
      DATABASE_wallet: aegis_wallet
      ENGINE_wallet: "postgres@dbgate-plugin-postgres"
      LABEL_reporting: Aegis Reporting DB
      SERVER_reporting: postgres-reporting
      PORT_reporting: 5432
      USER_reporting: aegis
      PASSWORD_reporting: ${DBGATE_PASSWORD_REPORTING:?DBGATE_PASSWORD_REPORTING must be set in infra/.env (copy .env.example)}
      DATABASE_reporting: aegis_reporting
      ENGINE_reporting: "postgres@dbgate-plugin-postgres"
      LABEL_audit: Aegis Audit DB
      SERVER_audit: postgres-audit
      PORT_audit: 5432
      USER_audit: aegis
      PASSWORD_audit: ${DBGATE_PASSWORD_AUDIT:?DBGATE_PASSWORD_AUDIT must be set in infra/.env (copy .env.example)}
      DATABASE_audit: aegis_audit
      ENGINE_audit: "postgres@dbgate-plugin-postgres"
      LABEL_fraud: Aegis Fraud DB
      SERVER_fraud: postgres-fraud
      PORT_fraud: 5432
      USER_fraud: aegis
      PASSWORD_fraud: ${DBGATE_PASSWORD_FRAUD:?DBGATE_PASSWORD_FRAUD must be set in infra/.env (copy .env.example)}
      DATABASE_fraud: aegis_fraud
      ENGINE_fraud: "postgres@dbgate-plugin-postgres"
      LABEL_payment: Aegis Payment DB
      SERVER_payment: postgres-payment
      PORT_payment: 5432
      USER_payment: aegis
      PASSWORD_payment: ${DBGATE_PASSWORD_PAYMENT:?DBGATE_PASSWORD_PAYMENT must be set in infra/.env (copy .env.example)}
      DATABASE_payment: aegis_payment
      ENGINE_payment: "postgres@dbgate-plugin-postgres"
      LABEL_redis: Aegis Redis
      SERVER_redis: redis
      PORT_redis: 6379
      ENGINE_redis: "redis@dbgate-plugin-redis"
    depends_on:
      postgres-identity:
        condition: service_healthy
      postgres-wallet:
        condition: service_healthy
      postgres-reporting:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
      postgres-fraud:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_wallet_data:
  postgres_reporting_data:
  postgres_audit_data:
  postgres_fraud_data:
  postgres_payment_data:
